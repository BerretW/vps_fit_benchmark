name: Collect approved benchmark

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read

concurrency:
  group: benchmark-results
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event.label.name == 'benchmark-approved' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sharing and collection
        run: python -B -m unittest discover -s tests -v
      - name: Validate and collect result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python .github/scripts/collect-results.py
      - name: Commit result and leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- results RESULTS.md
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update approved benchmark results" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push
